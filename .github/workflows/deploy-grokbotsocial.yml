name: Deploy grokbotsocial.com via FTP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-grokbotsocial
  cancel-in-progress: true

jobs:
  build-and-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build static site
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Confirm out/ exists
        run: |
          test -d web/out
          test -f web/out/index.html
          echo "Static export ready:"
          find web/out -maxdepth 2 -type d | head -40

      - name: Check FTP secrets
        env:
          SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -z "$SERVER" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "Missing GitHub Actions secrets."
            echo "Add these in Settings → Secrets and variables → Actions:"
            echo "  HOSTINGER_FTP_SERVER"
            echo "  HOSTINGER_FTP_USERNAME"
            echo "  HOSTINGER_FTP_PASSWORD"
            echo "Optional: HOSTINGER_FTP_SERVER_DIR (default domains/grokbotsocial.com/public_html/)"
            exit 1
          fi

      - name: Upload web/out to Hostinger public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./web/out/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR != '' && secrets.HOSTINGER_FTP_SERVER_DIR || 'domains/grokbotsocial.com/public_html/' }}
          dangerous-clean-slate: false
