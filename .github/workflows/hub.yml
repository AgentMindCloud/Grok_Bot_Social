name: Native hub and web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grokbot_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: grokbot_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U grokbot_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            hub/package-lock.json
      - run: npm ci --prefix hub --no-audit --no-fund
      - run: npm run build --prefix hub
      - name: Test PostgreSQL authorization, quota races, migration and device recovery
        run: npm test --prefix hub
        env:
          TEST_DATABASE_URL: postgresql://grokbot_test:ephemeral-ci-only@127.0.0.1:5432/grokbot_test
      - run: npm test --prefix integrations/native-grok
      - run: node --test deploy/backup-retention.test.mjs
      - run: node --test deploy/smoke.test.mjs
      - run: npm ci --prefix web --no-audit --no-fund
      - run: node scripts/security-audit.mjs --self-test
      - run: node scripts/security-audit.mjs web hub
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build static export and versioned native package
        run: npm run build --prefix web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify portable archive with standard ZIP reader
        run: |
          python3 - <<'PY'
          import zipfile,json,hashlib
          base='web/public/resources/native-grok-0.3.0'
          manifest=json.load(open(base+'.manifest.json'))
          with zipfile.ZipFile(base+'.zip') as archive:
              assert archive.testzip() is None
              for entry in manifest['files']:
                  assert hashlib.sha256(archive.read(entry['path'])).hexdigest()==entry['sha256']
          assert hashlib.sha256(open(base+'.zip','rb').read()).hexdigest()==manifest['archive']['sha256']
          PY
  deployment:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify deployment scripts
        run: for script in deploy/ci-smoke.sh deploy/package-release.sh deploy/load-release.sh; do bash -n "$script"; done
      - name: Build and verify separate edge, production and synthetic staging
        run: bash deploy/ci-smoke.sh
      - name: Verify runtime archive checksums
        working-directory: dist-release
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: runtime-${{ github.sha }}
          path: |
            dist-release/runtime-images.tar.gz
            dist-release/deployment.tar.gz
            dist-release/SHA256SUMS
          retention-days: 7
          compression-level: 0
  publish:
    needs: [verify, deployment]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: "runtime-${{ github.sha }}", path: dist-release}
      - name: Publish tested runtime bundle; production deployment is separate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist-release
          sha256sum --check --strict SHA256SUMS
          cd ..
          tag="runtime-${GITHUB_SHA:0:12}"
          gh release create "$tag" dist-release/runtime-images.tar.gz dist-release/deployment.tar.gz dist-release/SHA256SUMS --target "$GITHUB_SHA" --title "GrokBot Social runtime ${GITHUB_SHA:0:12}" --notes-file deploy/RELEASE-NOTES.md --draft --latest=false
          gh release edit "$tag" --draft=false --latest=false
