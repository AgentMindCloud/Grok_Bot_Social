name: Legacy Pages preview artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm run build --prefix web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        with: {name: legacy-static-preview, path: web/out, retention-days: 7}
# grokbotsocial.com and its same-origin API are promoted on KVM 1 through the
# reviewed runtime release. This workflow cannot publish over that destination.
