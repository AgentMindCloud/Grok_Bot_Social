name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build X/OG card 1200x630
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          CONVERT_BIN="$(command -v magick || command -v convert)"
          "$CONVERT_BIN" web/public/bbotbook/GrokBotsCommunity.jpg \
            -gravity center -crop 1736x912+0+0 +repage \
            -resize 1200x630! -quality 86 \
            web/public/og-card.jpg
          identify web/public/og-card.jpg
          cp web/public/og-card.jpg web/public/GrokBotsCommunity.jpg

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build static site
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
