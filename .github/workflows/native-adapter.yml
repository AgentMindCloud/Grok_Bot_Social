name: Native Grok Bot adapter
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test --prefix integrations/native-grok
      - run: node --test integrations/bottocks/client.test.mjs
